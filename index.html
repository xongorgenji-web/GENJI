<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenjiStore</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9}

/* HEADER */
header{
display:flex;
align-items:center;
justify-content:center;
gap:15px;
background:#6a1b9a;
color:white;
padding:18px;
}
header img{
width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
border:3px solid white;
}

/* SEARCH */
.search{background:#fff;padding:12px}
.search input{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc}

/* GRID */
.container{padding:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}

/* CARD */
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card img{width:100%;border-radius:8px}
.title{font-weight:bold}
.price{color:#2e7d32;font-weight:bold;font-size:18px}
.desc{font-size:13px;color:#555;margin:5px 0}

/* BUTTONS */
.btn{display:block;text-align:center;padding:10px;border-radius:6px;color:#fff;text-decoration:none;margin-top:6px;font-weight:bold}
.wa{background:#25D366}
.ig{background:#E1306C}

/* COMMENTS */
.comment-box{margin-top:8px}
.comment-box input{width:100%;padding:6px;margin-top:4px}
.comment{font-size:13px;background:#f0f0f0;padding:4px;margin-top:3px;border-radius:4px}

/* FOOTER */
footer{text-align:center;padding:18px;color:#777;background:#fff;margin-top:20px}

/* ADMIN PANEL */
.admin{display:none;background:#fff;padding:15px;border-top:3px solid #6a1b9a}
.admin input,.admin textarea{width:100%;padding:10px;margin:6px 0}
.admin button{padding:12px;background:#6a1b9a;color:#fff;border:none;width:100%;font-weight:bold}
</style>
</head>

<body>

<header>
<img src="https://i.postimg.cc/Vvq0TzYZ/file-00000000914471f88063a28abf67d7bc.png">

<div>
<h1 style="margin:0">GenjiStore</h1>
<p style="margin:0;font-size:14px">Smart Shopping • Better Prices</p>
</div>
</header>

<div class="search">
<input id="search" placeholder="Search..." onkeyup="renderProducts()">
</div>

<div class="container">
<div class="grid" id="grid"></div>
</div>

<footer>© 2026 GenjiStore • Powered by Genji 💜</footer>

<!-- ADMIN PANEL -->
<div class="admin" id="adminPanel">
<h3>Add Product</h3>

<input id="pname" placeholder="Product Name">
<input id="pimg" placeholder="Image URL (.jpg/.png/.webp)">
<input id="pprice" placeholder="Price">
<textarea id="pdesc" placeholder="Description"></textarea>

<button onclick="addProduct()">Add Product</button>
</div>

<script>
const WA="918731048644"
const IG="genji_xongor"
const ADMIN_PASS="940243"

let products=JSON.parse(localStorage.getItem("products")||"[]")

function renderProducts(){
let grid=document.getElementById("grid")
let s=document.getElementById("search").value.toLowerCase()
grid.innerHTML=""

products
.filter(p=>p.name.toLowerCase().includes(s))
.forEach((p,i)=>{

let comments=JSON.parse(localStorage.getItem("c"+i)||"[]")

grid.innerHTML+=`
<div class="card">

<div style="text-align:right">
<span onclick="askDelete(${i})"
style="cursor:pointer;font-size:20px;color:red">🗑️</span>
</div>

<img src="${p.img}">
<div class="title">${p.name}</div>
<div class="price">₹${p.price}</div>
<div class="desc">${p.desc}</div>

<a class="btn wa"
href="https://wa.me/${WA}?text=I want to order ${encodeURIComponent(p.name)}">
Order WhatsApp
</a>

<a class="btn ig"
href="https://instagram.com/${IG}" target="_blank">
Order Instagram
</a>

<div class="comment-box">
⭐ Rate:
<select onchange="saveRating(${i},this.value)">
<option>5</option><option>4</option><option>3</option><option>2</option><option>1</option>
</select>

<input placeholder="Write comment..."
onkeydown="if(event.key==='Enter')addComment(${i},this.value,this)">
</div>

<div id="comments${i}">
${comments.map(c=>`<div class='comment'>⭐${c.r} ${c.t}</div>`).join("")}
</div>

</div>`
})
}

function addProduct(){
let p={
name:pname.value,
img:pimg.value,
price:pprice.value,
desc:pdesc.value
}
products.push(p)
localStorage.setItem("products",JSON.stringify(products))
renderProducts()
alert("Product Added!")
}

function askDelete(i){
let pass = prompt("Enter Admin Password")
if(pass === ADMIN_PASS){
deleteProduct(i)
}else if(pass !== null){
alert("Wrong password!")
}
}

function deleteProduct(i){
if(confirm("Delete this product?")){
products.splice(i,1)
localStorage.setItem("products",JSON.stringify(products))
renderProducts()
}
}

function addComment(i,text,input){
let c=JSON.parse(localStorage.getItem("c"+i)||"[]")
let r=localStorage.getItem("r"+i)||5
c.push({t:text,r:r})
localStorage.setItem("c"+i,JSON.stringify(c))
renderProducts()
}

function saveRating(i,val){
localStorage.setItem("r"+i,val)
}

/* TRIPLE TAP FOOTER → ADMIN PANEL */
let taps=0
document.querySelector("footer").addEventListener("click",()=>{
taps++
setTimeout(()=>taps=0,600)
if(taps===3){
document.getElementById("adminPanel").style.display="block"
}
})

renderProducts()
</script>

</body>
</html>
