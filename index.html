<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenjiStore</title><style>
body{margin:0;font-family:Arial;background:#f4f6f9}

/* HEADER */
header{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
background:#6a1b9a;
color:white;
padding:14px;
}
header img{
width:60px;height:60px;border-radius:50%;
object-fit:cover;border:3px solid white;
}

/* SEARCH */
.search{background:#fff;padding:10px}
.search input{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc}

/* GRID — MEESHO STYLE */
.container{padding:10px}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
}

.card{
background:white;
border-radius:10px;
padding:6px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
cursor:pointer;
font-size:13px;
}

.card img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:8px;
}

.title{font-weight:bold;margin:4px 0}
.price{color:#2e7d32;font-weight:bold}

/* POPUP PRODUCT PAGE */
.popup{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.7);
z-index:1000;
align-items:center;
justify-content:center;
}

.popup-content{
background:white;
width:90%;
max-width:420px;
border-radius:12px;
padding:15px;
}

.popup img{
width:100%;
border-radius:10px;
}

.close{
font-size:22px;
float:right;
cursor:pointer;
}

/* BUTTONS */
.btn{
display:block;
text-align:center;
padding:12px;
border-radius:8px;
color:white;
text-decoration:none;
margin-top:8px;
font-weight:bold;
}
.wa{background:#25D366}
.ig{background:#E1306C}

/* ADMIN */
footer{text-align:center;padding:15px;color:#777;background:#fff;margin-top:20px}
.admin{display:none;background:#fff;padding:15px;border-top:3px solid #6a1b9a}
.admin input,.admin textarea{width:100%;padding:10px;margin:6px 0}
.admin button{padding:12px;background:#6a1b9a;color:#fff;border:none;width:100%}
</style></head><body><header>
<img src="https://i.postimg.cc/Vvq0TzYZ/file-00000000914471f88063a28abf67d7bc.png">
<div>
<h1 style="margin:0">GenjiStore</h1>
<p style="margin:0;font-size:14px">Smart Shopping • Better Prices</p>
</div>
</header><div class="search">
<input id="search" placeholder="Search..." onkeyup="renderProducts()">
</div><div class="container">
<div class="grid" id="grid"></div>
</div><footer>© 2026 GenjiStore • Powered by Genji 💜</footer><!-- PRODUCT POPUP --><div class="popup" id="popup">
<div class="popup-content" id="popupContent"></div>
</div><!-- ADMIN PANEL --><div class="admin" id="adminPanel">
<h3>Add Product</h3>
<input id="pname" placeholder="Product Name">
<input id="pimg" placeholder="Image URL">
<input id="pprice" placeholder="Price">
<textarea id="pdesc" placeholder="Description"></textarea>
<button onclick="addProduct()">Add Product</button>
</div><!-- 🔥 FIREBASE (ONLY CHANGE) --><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyAXFjXQCVJTdnh3DVBup9wBtLymWBl3kq0",
authDomain:"projectgenji-96a0a.firebaseapp.com",
databaseURL:"https://projectgenji-96a0a-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"projectgenji-96a0a",
storageBucket:"projectgenji-96a0a.firebasestorage.app",
messagingSenderId:"540025118438",
appId:"1:540025118438:web:42fc51f610d923e1586527"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const WA="918731048644"
const IG="genji_xongor"

let products=[];

/* LOAD PRODUCTS FROM CLOUD */
onValue(ref(db,"products"),snap=>{
products=[];
snap.forEach(c=>products.push(c.val()));
renderProducts();
});

window.renderProducts=function(){
let grid=document.getElementById("grid");
let s=document.getElementById("search").value.toLowerCase();
grid.innerHTML="";

products
.filter(p=>p.name.toLowerCase().includes(s))
.forEach((p,i)=>{
grid.innerHTML+=`
<div class="card" onclick="openPopup(${i})">
<img src="${p.img}">
<div class="title">${p.name}</div>
<div class="price">₹${p.price}</div>
</div>`;
});
};

window.openPopup=function(i){
let p=products[i];
document.getElementById("popup").style.display="flex";

document.getElementById("popupContent").innerHTML=`
<span class="close" onclick="closePopup()">❌</span>

<img src="${p.img}">
<h3>${p.name}</h3>
<p><b>₹${p.price}</b></p>
<p>${p.desc}</p>

<a class="btn wa"
href="https://wa.me/${WA}?text=I want to order ${encodeURIComponent(p.name)}">
Order WhatsApp
</a>

<a class="btn ig"
href="https://instagram.com/${IG}" target="_blank">
Order Instagram
</a>
`;
};

window.closePopup=function(){
document.getElementById("popup").style.display="none";
};

/* ADD PRODUCT TO CLOUD */
window.addProduct=function(){
push(ref(db,"products"),{
name:pname.value,
img:pimg.value,
price:pprice.value,
desc:pdesc.value
});
alert("Product Added 💰");
};

/* TRIPLE TAP FOOTER → ADMIN */
let taps=0;
document.querySelector("footer").addEventListener("click",()=>{
taps++;
setTimeout(()=>taps=0,600);
if(taps===3){
document.getElementById("adminPanel").style.display="block";
}
});

</script></body>
</html>
